[package]
name = "intueina-server"
version = "0.1.0"
edition = "2021"
description = "Axum server — full spec surface, nothing less (fixes F-003)"

[[bin]]
name = "intueina-rs"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
intueina-store = { path = "../store" }
intueina-embed = { path = "../embed" }
intueina-cortex = { path = "../cortex" }
intueina-config = { path = "../config" }
intueina-gate = { path = "../gate" }
intueina-observer = { path = "../observer" }
uuid = { workspace = true }
